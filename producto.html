<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producto | Cocinas ColoryMarmol</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<style>
:root{--bg:#f8f6f1;--ink:#171715;--gold:#b77f2b;--gold-dark:#96651f;--line:#e2d9cc;--muted:#6e685f}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;line-height:1.55}a{text-decoration:none;color:inherit}img{display:block;max-width:100%}.container{width:min(1180px,calc(100% - 34px));margin:auto}
.header{position:sticky;top:0;z-index:50;background:#111;color:white;padding:18px 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:20px}.logo{font-family:Georgia,serif;font-size:23px;font-weight:bold}.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:white;padding:13px 20px;border-radius:5px;font-weight:bold;border:0;cursor:pointer;transition:.2s}.btn:hover{background:var(--gold-dark);transform:translateY(-1px)}
.btn-back-home{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 16px;border:1px solid rgba(255,255,255,.26);border-radius:6px;background:transparent;color:white;font-size:12px;font-weight:700;transition:.2s}.btn-back-home:hover{background:white;color:#171715}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:45px;align-items:center;padding:60px 0}.hero img{width:100%;height:520px;object-fit:cover;border-radius:10px;cursor:zoom-in}.tag{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:bold;text-transform:uppercase}.hero h1,.display{font-family:Georgia,serif}.hero h1{font-size:56px;line-height:1.05;margin:10px 0}.hero p{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{background:#eee6da;padding:9px 12px;border-radius:4px;font-size:12px}.section{padding:70px 0}.detail{display:grid;grid-template-columns:1fr 1fr;gap:50px}.display{font-size:42px}.features{padding-left:20px}.features li{margin:10px 0}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.gallery img{width:100%;height:210px;object-fit:cover;border-radius:8px;cursor:zoom-in}.material-box{margin-top:28px;background:#eee7dd;border:1px solid var(--line);border-radius:10px;padding:22px}.material-box h3{font-family:Georgia,serif;font-size:26px;margin:4px 0 8px}.material-box p{color:var(--muted);margin:0}.back{color:var(--gold);font-weight:bold;font-size:13px;display:inline-block;margin-top:18px}
.footer{background:#111;color:white;padding:40px 0;margin-top:40px}.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}.empty{min-height:60vh;display:grid;place-items:center;text-align:center}.lightbox{position:fixed;inset:0;z-index:1000;display:none;place-items:center;background:#000e;padding:25px}.lightbox.open{display:grid}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}.lightbox button{position:absolute;top:20px;right:25px;width:44px;height:44px;border:0;border-radius:50%;background:#ffffff1f;color:white;font-size:28px;cursor:pointer}
@media(max-width:800px){.hero,.detail{grid-template-columns:1fr}.hero img{height:350px}.hero h1{font-size:42px}.gallery{grid-template-columns:1fr 1fr}.footer-inner{flex-direction:column;align-items:flex-start}}@media(max-width:600px){.nav{align-items:flex-start}.logo{font-size:18px}.btn-back-home .label{display:none}.btn-back-home{padding:10px 13px}.btn{padding:10px 13px;font-size:11px}}
</style>
</head>
<body>
<header class="header"><div class="container nav"><a class="logo" href="../index.html">Cocinas ColoryMarmol</a><div class="header-actions"><a href="../index.html" class="btn-back-home"><span>←</span><span class="label">Regresar a la página principal</span></a><a class="btn" href="../index.html#cotizar">Cotizar</a></div></div></header>
<main class="container" id="app"><section class="empty"><div><h1 class="display">Cargando producto...</h1><p>Estamos obteniendo la información del catálogo.</p></div></section></main>
<footer class="footer"><div class="container footer-inner"><div>Cocinas ColoryMarmol · Diseño · Fabricación · Instalación</div><a href="../index.html" class="btn-back-home"><span>←</span><span class="label">Regresar a la página principal</span></a></div></footer>
<div class="lightbox" id="lightbox"><button type="button" id="lightboxClose">×</button><img id="lightboxImage" alt="Imagen ampliada"></div>
<script>
const cfg=window.COLORYMARMOL_CONFIG;const sb=window.supabaseClient;const TABLE="Productos";const app=document.getElementById("app");const params=new URLSearchParams(location.search),slug=params.get("slug"),id=params.get("id");
function esc(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}function arr(v){return Array.isArray(v)?v:[]}function categoryLabel(v){return {cocinas:"Cocinas",closets:"Closets",vestidores:"Vestidores",banos:"Baños",encimeras:"Encimeras"}[v]||v||"Producto"}
function materialDescription(material,acabado){const m=String(material||"").toLowerCase();if(m.includes("sinterizada"))return "La piedra sinterizada es un material de alto desempeño utilizado en proyectos contemporáneos. Ofrece gran resistencia, fácil mantenimiento y una amplia variedad de acabados. En este proyecto aporta una apariencia elegante y sofisticada, ideal para mobiliario fabricado a medida.";return `${material||"El material seleccionado"} se integra al proyecto con un acabado ${acabado||"personalizado"}, buscando equilibrio entre funcionalidad, resistencia y diseño.`}
async function load(){if(!sb)return notFound("No fue posible conectar con el catálogo.");if(!slug&&!id)return notFound("No se indicó ningún producto.");let q=sb.from(TABLE).select("*").eq("estado","publicado");if(slug)q=q.eq("slug",slug);else q=q.eq("id",id);const {data,error}=await q.limit(1).maybeSingle();if(error){console.error(error);return notFound("No fue posible cargar este producto.")}if(!data)return notFound("El producto no existe o todavía no está publicado.");renderProduct(data)}
function renderProduct(p){const features=arr(p.caracteristicas),apps=arr(p.aplicaciones),tags=arr(p.etiquetas),gallery=[...new Set([p.imagen_principal,...arr(p.galeria)].filter(Boolean))],name=esc(p.nombre),mainImage=p.imagen_principal||"../productos/images/hero-colorymarmol.jpg",whatsapp="https://wa.me/"+cfg.whatsapp+"?text="+encodeURIComponent('Hola, vi el proyecto "'+p.nombre+'" en la página de Cocinas ColoryMarmol y me gustaría solicitar información y una cotización.');document.title=p.nombre+" | Cocinas ColoryMarmol";app.innerHTML=`<section class="hero"><img src="${mainImage}" alt="${name}" data-lightbox><div><span class="tag">${esc(categoryLabel(p.categoria))}</span><h1>${name}</h1><p>${esc(p.descripcion_corta||p.descripcion||"")}</p><div class="chips">${p.material?`<span class="chip">${esc(p.material)}</span>`:""}${p.acabado?`<span class="chip">${esc(p.acabado)}</span>`:""}<span class="chip">Fabricación a medida</span><span class="chip">Instalación profesional</span></div><a class="btn" target="_blank" rel="noopener" href="${whatsapp}">Cotizar este diseño</a><br><a class="back" href="../index.html#productos">← Volver al catálogo</a></div></section>${gallery.length?`<section class="section"><span class="tag">GALERÍA DEL PROYECTO</span><h2 class="display">Detalles del diseño</h2><div class="gallery">${gallery.map(u=>`<img src="${u}" alt="${name}" loading="lazy" data-lightbox>`).join("")}</div></section>`:""}<section class="section"><div class="detail"><div><span class="tag">DESCRIPCIÓN</span><h2 class="display">Diseñado para tu espacio</h2><p>${esc(p.descripcion||p.descripcion_corta||"")}</p>${tags.length?`<div class="chips">${tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`:""}<div class="material-box"><span class="tag">SOBRE EL MATERIAL</span><h3>${esc(p.material||"Material personalizado")}</h3><p>${esc(materialDescription(p.material,p.acabado))}</p></div></div><div><span class="tag">CARACTERÍSTICAS</span><h2 class="display">Calidad en cada detalle</h2><ul class="features">${(features.length?features:["Fabricación personalizada","Materiales seleccionados","Instalación profesional"]).map(f=>`<li>${esc(f)}</li>`).join("")}</ul>${apps.length?`<h3>Aplicaciones</h3><ul class="features">${apps.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:""}</div></div></section>`;bindLightbox()}
function notFound(message){app.innerHTML=`<section class="empty"><div><span class="tag">COCINAS COLORYMARMOL</span><h1 class="display">Producto no encontrado</h1><p>${esc(message)}</p><a class="btn" href="../index.html">← Regresar a la página principal</a></div></section>`}
function bindLightbox(){const lb=document.getElementById("lightbox"),img=document.getElementById("lightboxImage");document.querySelectorAll("[data-lightbox]").forEach(el=>{el.onclick=()=>{img.src=el.src;lb.classList.add("open")}})}document.getElementById("lightboxClose").onclick=()=>document.getElementById("lightbox").classList.remove("open");document.getElementById("lightbox").onclick=e=>{if(e.target.id==="lightbox")e.currentTarget.classList.remove("open")};load();
</script>
</body>
</html>
