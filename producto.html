<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producto | Cocinas ColoryMarmol</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script>
<style>
:root{--bg:#f8f6f1;--ink:#171715;--gold:#b77f2b;--line:#e2d9cc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;line-height:1.55}a{text-decoration:none;color:inherit}.container{width:min(1180px,calc(100% - 34px));margin:auto}
.header{background:#111;color:white;padding:18px 0}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-family:Georgia,serif;font-size:23px}.btn{display:inline-block;background:var(--gold);color:white;padding:13px 20px;border-radius:4px;font-weight:bold}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:45px;align-items:center;padding:60px 0}.hero img{width:100%;height:520px;object-fit:cover;border-radius:10px}.tag{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:bold;text-transform:uppercase}.hero h1,.display{font-family:Georgia,serif}.hero h1{font-size:56px;line-height:1.05;margin:10px 0}.hero p{color:#6e685f}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{background:#eee6da;padding:9px 12px;border-radius:4px;font-size:12px}.section{padding:70px 0}.detail{display:grid;grid-template-columns:1fr 1fr;gap:50px}.display{font-size:42px}.features li{margin:10px 0}.footer{background:#111;color:white;padding:40px 0;margin-top:40px}.back{color:var(--gold);font-weight:bold;font-size:13px;display:inline-block;margin-top:18px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.gallery img{width:100%;height:210px;object-fit:cover;border-radius:8px}
@media(max-width:800px){.hero,.detail{grid-template-columns:1fr}.hero img{height:350px}.hero h1{font-size:42px}}
</style>
</head>
<body>
<header class="header"><div class="container nav"><a class="logo" href="../index.html">Cocinas ColoryMarmol</a><a class="btn" href="../index.html#cotizar">Cotizar</a></div></header>
<main class="container" id="app"></main>
<footer class="footer"><div class="container">Cocinas ColoryMarmol · Diseño · Fabricación · Instalación</div></footer>
<script>
const cfg=COLORYMARMOL_CONFIG,sb=supabase.createClient(cfg.supabase.url,cfg.supabase.publishableKey),app=document.getElementById('app');
const params=new URLSearchParams(location.search),slug=params.get('slug'),id=params.get('id');
async function load(){let q=sb.from(cfg.supabase.table).select('*').eq('estado','publicado').limit(1);if(slug)q=q.eq('slug',slug);else if(id)q=q.eq('id',id);else return notFound();const {data,error}=await q.maybeSingle();if(error||!data)return notFound();const p=data;document.title=p.nombre+' | Cocinas ColoryMarmol';const features=(Array.isArray(p.caracteristicas)?p.caracteristicas:[]).map(f=>'<li>'+f+'</li>').join('');const apps=(Array.isArray(p.aplicaciones)?p.aplicaciones:[]).map(f=>'<li>'+f+'</li>').join('');const gal=[p.imagen_principal,...(Array.isArray(p.galeria)?p.galeria:[])].filter(Boolean);app.innerHTML=`<section class="hero"><img src="${p.imagen_principal||'images/hero-colorymarmol.jpg'}" alt="${p.nombre}"><div><span class="tag">${p.categoria||''}</span><h1>${p.nombre}</h1><p>${p.descripcion_corta||p.descripcion||''}</p><div class="chips">${p.material?'<span class="chip">'+p.material+'</span>':''}${p.acabado?'<span class="chip">'+p.acabado+'</span>':''}<span class="chip">Fabricación a medida</span></div><a class="btn" target="_blank" href="https://wa.me/${cfg.whatsapp}?text=${encodeURIComponent('Hola, vi el modelo '+p.nombre+' en su página y me gustaría solicitar una cotización.')}">Cotizar este diseño</a><br><a class="back" href="../index.html#productos">← Volver al catálogo</a></div></section>${gal.length?`<section class="section"><span class="tag">GALERÍA</span><div class="gallery">${gal.map(u=>`<img src="${u}" alt="${p.nombre}">`).join('')}</div></section>`:''}<section class="section"><div class="detail"><div><span class="tag">DESCRIPCIÓN</span><h2 class="display">Diseñado para tu espacio</h2><p>${p.descripcion||p.descripcion_corta||''}</p></div><div><span class="tag">CARACTERÍSTICAS</span><ul class="features">${features||'<li>Fabricación personalizada</li><li>Materiales seleccionados</li><li>Instalación profesional</li>'}</ul>${apps?'<h3>Aplicaciones</h3><ul class="features">'+apps+'</ul>':''}</div></div></section>`}
function notFound(){app.innerHTML='<section class="section"><h1 class="display">Producto no encontrado</h1><p>El producto no existe o todavía no está publicado.</p><a class="btn" href="../index.html#productos">Volver al catálogo</a></section>'}
load();
</script>
</body></html>
